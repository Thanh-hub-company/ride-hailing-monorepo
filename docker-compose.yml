version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ride_hailing_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql/init-all-databases.sql:/docker-entrypoint-initdb.d/00-init-all-databases.sql

  redis:
    image: redis:7-alpine
    container_name: ride_hailing_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ride_hailing_rmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
