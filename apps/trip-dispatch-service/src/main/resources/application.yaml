server:
  port: 8086

spring:
  application:
    name: trip-service
  datasource:
    url: jdbc:postgresql://localhost:5432/trip_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
trip:
  offer-timeout-seconds: 15 # Thời gian chờ tài xế phản hồi Offer

pricing-service:
  base-url: http://localhost:8084

identity-service:
  base-url: http://localhost:8085

