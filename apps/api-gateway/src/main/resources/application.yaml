server:
  port: 8081

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/drivers/**
        - id: telemetry-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/telemetry/**, /ws/telemetry/**
        - id: pricing-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/pricing/**, /api/v1/quotes/**
        - id: trip-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/trips/**, /api/v1/driver/**, /api/v1/offers/**, /api/v1/dispatch/**
        - id: payment-wallet-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/wallets/**, /api/v1/payments/**

